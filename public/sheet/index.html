<!DOCTYPE html>
<!-- TCA Tours — Feedback results, v2. Every questionnaire, behind its own password, with Download as Excel. -->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feedback results · TCA Tours</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A292B">
<link rel="icon" type="image/png" href="/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/feedback/feedback.css">
<style>
  main{max-width:980px}
  header .in{max-width:980px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row .field{margin:0;flex:1;min-width:180px}
  .tabsbar{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
  .tabsbar button{border:1px solid var(--charcoal);background:transparent;padding:9px 12px;font-size:13.5px;cursor:pointer}
  .tabsbar button.on{background:var(--charcoal);color:#fff}
  .tabsbar b{font-weight:600;margin-left:4px;opacity:.8}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
  .stat div{background:#fff;border:1px solid var(--hairline);padding:12px}
  .stat b{font-family:var(--display);font-size:30px;font-weight:600;display:block;line-height:1}
  .stat span{font-size:12.5px;color:var(--slate)}
  .quote{font-family:var(--display);font-size:20px;line-height:1.35}
  .meta{font-size:12.5px;color:var(--slate);margin-top:4px}
  .lnk{border:0;background:none;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;font-weight:600;font-size:13px;cursor:pointer;padding:0;color:var(--charcoal)}
  dl{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 14px;font-size:13.5px;margin-top:10px}
  dt{color:var(--slate)} dd{overflow-wrap:anywhere;white-space:pre-wrap}
  details summary{cursor:pointer;font-weight:600;font-size:13px;margin-top:8px}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
  th{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);text-align:left;padding:8px;border-bottom:2px solid var(--gold)}
  td{padding:9px 8px;border-bottom:1px solid var(--hairline);vertical-align:top}
  td.n{text-align:right;font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
  .grid .pc{background:#fff;border:1px solid var(--hairline);padding:8px}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--stone)}
  .tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;background:var(--stone);margin-top:6px}
  .tag.gold{background:var(--gold)} .tag.red{background:var(--alarm);color:#fff}
  .gate{max-width:420px;margin:30px auto}
</style>
</head>
<body>
<header><div class="in"><img src="/img/tca-logo-horizontal-white.png" alt="TCA Tours"><span>Feedback results</span></div></header>
<main id="main"><p class="intro">Loading…</p></main>
<script src="/sheet/results.js"></script>
</body>
</html>
