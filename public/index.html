<!DOCTYPE html>
<!--
  TCA Tours — Holmfirth High · New York 2026 — tour app
  Version: v1  |  11 October 2026
  Built to the TCA Tours brand book v1: charcoal, gold, Cormorant Garamond + Work Sans, square corners.
  Public data: js/tour-default.js (bundled) or the published feed. Staff data: password-protected feed only.
-->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="version" content="v1">
<title>Holmfirth High · New York 2026</title>
<meta name="description" content="TCA Tours — itinerary, getting around, safety tips and help for the Holmfirth High New York trip.">
<meta name="theme-color" content="#2A292B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Holmfirth NYC">
<link rel="icon" type="image/png" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script>
/* Remove any old service worker / caches so a new deploy always shows. */
(function(){ try{
  if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){}); }
  if(window.caches && caches.keys){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){}); }
}catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
  :root{
    --charcoal:#414042; --gold:#EFCA50; --white:#FFFFFF; --ink:#2A292B;
    --stone:#F4F3F1; --slate:#6E6D70; --hairline:#DDDCDC;
    --alarm:#B03A2E;            /* emergency only — see README */
    --display:'Cormorant Garamond', Garamond, Georgia, serif;
    --body:'Work Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--body);font-size:15px;line-height:1.55;color:var(--charcoal);background:var(--ink);
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center;min-height:100dvh}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:inherit;text-decoration-color:var(--gold);text-underline-offset:3px}

  /* ---------- shell: full-screen on a phone, a phone-sized frame on a desktop ---------- */
  .app{position:relative;width:100%;height:100dvh;background:var(--stone);display:flex;flex-direction:column;overflow:hidden}
  @media (min-width:560px){
    body{padding:24px;background:var(--ink)}
    .app{width:400px;height:min(860px,calc(100dvh - 48px));box-shadow:0 30px 80px rgba(0,0,0,.45)}
  }

  .appbar{flex:0 0 auto;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
  .appbar .brand{display:flex;align-items:center;flex:1;min-width:0}
  .appbar .brand img{width:170px;height:auto;display:block}
  .iconbtn{width:40px;height:40px;border:0;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer;position:relative;flex:0 0 auto}
  .iconbtn:active{transform:scale(.95)}
  .iconbtn.sos{background:var(--alarm)}
  .iconbtn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;background:var(--gold);display:none}
  .iconbtn .dot.on{display:block}
  .app.locked .iconbtn.bell, .app.locked .tabbar{display:none}

  .screens{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .screens::-webkit-scrollbar{width:0}
  .screen{display:none;padding:18px 16px 28px;animation:fade .2s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}}

  /* ---------- type ---------- */
  .label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--slate);
    display:flex;align-items:center;gap:11px;margin:22px 0 10px}
  .label::before{content:"";width:3px;height:16px;background:var(--gold);flex:none}
  .label:first-child{margin-top:4px}
  h1,h2,h3{font-family:var(--display);color:var(--charcoal);line-height:1.08;font-weight:500}
  h1{font-size:40px} h1 em,h2 em{font-style:italic}
  h2{font-size:30px;margin-bottom:6px}
  h3{font-size:22px;font-weight:600}
  .muted{color:var(--slate)}
  .small{font-size:13px}
  p+p{margin-top:.6em}
  .num{font-family:var(--display);font-weight:600}

  /* ---------- cards ---------- */
  .card{background:var(--white);border:1px solid var(--hairline);padding:16px;margin:10px 0;position:relative}
  .card.rule::before{content:"";position:absolute;left:-1px;top:-1px;width:3px;height:52px;background:var(--gold)}
  .card.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .card.dark h2,.card.dark h3{color:#fff}
  .card.dark .muted{color:#B7B6B9}
  .card .cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

  /* ---------- buttons (square, gold = the one primary action) ---------- */
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;cursor:pointer;
    font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:15px 18px;text-decoration:none;text-align:center}
  .btn i{font-size:19px}
  .btn.gold{background:var(--gold);color:var(--charcoal)}
  .btn.line{background:transparent;color:var(--charcoal);box-shadow:inset 0 0 0 1px var(--charcoal)}
  .btn.dark{background:var(--charcoal);color:#fff}
  .btn.alarm{background:var(--alarm);color:#fff}
  .btn.ghost{background:transparent;color:var(--slate);text-transform:none;letter-spacing:0;font-weight:500}
  .btn+.btn{margin-top:10px}
  .btn:active{filter:brightness(.95);transform:scale(.99)}
  .btnrow{display:flex;gap:10px}.btnrow .btn{margin:0}
  .linkbtn{border:0;background:none;color:var(--charcoal);font-weight:600;font-size:13px;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;cursor:pointer;padding:0}

  /* ---------- sign-in ---------- */
  .signin{padding-top:28px}
  .signin .lockup{width:150px;margin:6px 0 28px}
  .signin h1{font-size:46px;font-weight:400;margin-bottom:12px}
  .signin .rule{height:3px;width:64px;background:var(--gold);margin:18px 0}
  .who{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--white);border:1px solid var(--hairline);padding:15px 16px;margin:10px 0;cursor:pointer}
  .who .ic{width:42px;height:42px;display:grid;place-items:center;background:var(--stone);font-size:21px;flex:none}
  .who.primary .ic{background:var(--gold)}
  .who b{display:block;font-family:var(--display);font-size:21px;font-weight:600;line-height:1.1}
  .who span{font-size:13px;color:var(--slate)}
  .who .arr{margin-left:auto;color:var(--slate);font-size:20px}
  .field{width:100%;border:1px solid var(--charcoal);background:#fff;padding:13px 14px;font-size:16px;border-radius:0}
  .field:focus{outline:2px solid var(--gold);outline-offset:0}
  .err{color:var(--alarm);font-size:13px;margin-top:8px;display:none}
  .err.on{display:block}

  /* ---------- weather / clocks ---------- */
  .wx{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--hairline);padding:12px 14px;cursor:pointer;width:100%;text-align:left}
  .wx .wi{font-size:30px;color:var(--charcoal)}
  .wx .wt{font-family:var(--display);font-size:32px;font-weight:600;line-height:1}
  .wx .wl{font-size:13px;color:var(--slate)}
  .wx .wr{margin-left:auto;text-align:right;font-size:12.5px;color:var(--slate)}
  .clocks{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hairline);border-top:0;background:var(--white)}
  .clocks div{padding:9px 14px;font-size:12px;color:var(--slate);letter-spacing:.04em}
  .clocks div+div{border-left:1px solid var(--hairline)}
  .clocks b{font-family:var(--display);font-size:22px;font-weight:600;color:var(--charcoal);display:block;line-height:1.1;letter-spacing:0}

  /* ---------- up next ---------- */
  .next{background:var(--ink);color:#fff;padding:18px 16px 16px;margin:14px 0 6px;position:relative;cursor:pointer}
  .next::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--gold)}
  .next .eyb{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:#B7B6B9}
  .next h2{color:#fff;font-size:28px;margin:6px 0 6px}
  .next .meta{font-size:13.5px;color:#D9D8DA;display:flex;gap:6px;align-items:center}
  .cd{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
  .cd .n{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
  .cd .l{font-size:12.5px;color:#B7B6B9}

  /* ---------- itinerary rows ---------- */
  .day{margin-top:22px}
  .dayhead{display:flex;align-items:baseline;gap:12px;padding:0 0 8px;border-bottom:1px solid var(--hairline);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
  .dayhead .dn{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--slate);white-space:nowrap}
  .dayhead h3{font-size:24px;font-weight:500}
  .dayhead .today{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:var(--gold);color:var(--charcoal);padding:3px 8px}
  .row{display:flex;gap:12px;align-items:flex-start;background:var(--white);border:1px solid var(--hairline);border-top:0;padding:12px 12px;cursor:pointer;width:100%;text-align:left}
  .dayhead+.row,.daybody>.row:first-child{border-top:1px solid var(--hairline);margin-top:10px}
  .row:active{background:#FBFAF8}
  .row .t{min-width:56px;font-family:var(--display);font-size:19px;font-weight:600;line-height:1.1;color:var(--charcoal)}
  .row .t small{display:block;font-family:var(--body);font-size:10.5px;font-weight:500;color:var(--slate);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
  .row .ic{width:30px;height:30px;display:grid;place-items:center;background:var(--stone);font-size:17px;flex:none;color:var(--charcoal)}
  .row .bd{flex:1;min-width:0}
  .row .tt{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
  .row .wh{font-size:12.5px;color:var(--slate);margin-top:2px;overflow-wrap:anywhere}
  .row.past{opacity:.5}
  .row.now{box-shadow:inset 3px 0 0 var(--gold)}
  .row .chev{color:var(--slate);font-size:18px;align-self:center}
  .tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;background:var(--stone);color:var(--charcoal);margin-top:6px}
  .tag.gold{background:var(--gold)}
  .tag.alarm{background:var(--alarm);color:#fff}

  /* ---------- detail ---------- */
  .back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--charcoal);font-weight:600;font-size:14px;padding:4px 0 8px;cursor:pointer}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:10px}
  .kv dt{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);padding-top:2px}
  .kv dd{overflow-wrap:anywhere}
  .prose p{margin:.55em 0}
  .prose ul{margin:.5em 0 .5em 0;padding:0;list-style:none}
  .prose li{padding:8px 0 8px 18px;position:relative;border-bottom:1px solid var(--hairline)}
  .prose li:last-child{border-bottom:0}
  .prose li::before{content:"";position:absolute;left:0;top:16px;width:7px;height:2px;background:var(--gold)}

  /* ---------- tiles ---------- */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--white);border:1px solid var(--hairline);padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;position:relative}
  .tile i{font-size:24px;color:var(--charcoal)}
  .tile b{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.1;margin-top:10px}
  .tile span{font-size:12px;color:var(--slate);margin-top:2px}
  .tile.alarm{background:var(--alarm);border-color:var(--alarm);color:#fff}
  .tile.alarm i,.tile.alarm span{color:#fff}
  .tile.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .tile.dark i{color:#fff}.tile.dark span{color:#B7B6B9}
  .tile::before{content:"";position:absolute;left:-1px;top:-1px;width:3px;height:26px;background:var(--gold)}
  .tile.alarm::before{display:none}

  /* ---------- lists / tables ---------- */
  .list{background:var(--white);border:1px solid var(--hairline)}
  .li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--hairline)}
  .li:first-child{border-top:0}
  .li .bd{flex:1;min-width:0}
  .li b{font-weight:600}
  .li .sub{font-size:12.5px;color:var(--slate);overflow-wrap:anywhere}
  .li a.call,.li button.call{flex:none;width:40px;height:40px;display:grid;place-items:center;background:var(--charcoal);color:#fff;font-size:18px;text-decoration:none;border:0;cursor:pointer}
  .count{font-family:var(--display);font-weight:600;font-size:24px;line-height:1;min-width:34px;text-align:right}
  .flag{color:var(--alarm);font-weight:600}
  .search{margin:6px 0 10px}

  /* register */
  .regbar{position:sticky;top:-18px;z-index:3;background:var(--stone);padding:10px 0;margin:-6px 0 6px;display:flex;align-items:center;gap:12px}
  .regbar .big{font-family:var(--display);font-size:38px;font-weight:600;line-height:1}
  .regbar .of{color:var(--slate);font-size:13px}
  .pupil{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--white);border:1px solid var(--hairline);border-top:0;padding:12px 14px;cursor:pointer;min-height:54px}
  .pupil:first-child{border-top:1px solid var(--hairline)}
  .pupil .box{width:28px;height:28px;border:2px solid var(--charcoal);display:grid;place-items:center;flex:none;font-size:18px;color:transparent}
  .pupil.on .box{background:var(--charcoal);color:#fff}
  .pupil .nm{flex:1;font-weight:500}
  .pupil .gp{font-size:12px;color:var(--slate)}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .seg button{border:1px solid var(--charcoal);background:transparent;padding:7px 11px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--charcoal);color:#fff}
  .roominput{width:86px;border:1px solid var(--hairline);padding:8px 9px;font-size:15px;text-align:center;background:var(--stone);border-radius:0}
  .roominput:focus{outline:2px solid var(--gold);background:#fff}

  /* subway diagram */
  .subway{background:var(--white);border:1px solid var(--hairline);padding:8px 4px}
  .subway svg{width:100%;height:auto;display:block}
  .bullet{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:700;font-size:12.5px;font-family:Arial,Helvetica,sans-serif;vertical-align:middle}
  .dirs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dirs .card{margin:0}

  /* ---------- tab bar ---------- */
  .tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--white);border-top:1px solid var(--hairline);padding-bottom:env(safe-area-inset-bottom)}
  .tab{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--slate);cursor:pointer;position:relative;font-weight:500}
  .tab i{font-size:23px}
  .tab.active{color:var(--charcoal);font-weight:600}
  .tab.active::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;background:var(--gold)}

  /* ---------- modal / toast ---------- */
  .modal{position:absolute;inset:0;background:rgba(42,41,43,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal.on{display:flex}
  .sheet{background:var(--white);width:100%;max-height:88%;overflow:auto;padding:22px 18px calc(18px + env(safe-area-inset-bottom));position:relative}
  .sheet::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--gold)}
  .toast{position:absolute;left:16px;right:16px;bottom:82px;background:var(--ink);color:#fff;padding:12px 14px;font-size:14px;z-index:30;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:none}
  .offline{background:var(--charcoal);color:#fff;font-size:12px;padding:6px 16px;display:none;text-align:center}
  .offline.on{display:block}
  .foot{text-align:center;font-size:11px;color:var(--slate);margin-top:26px;letter-spacing:.04em}
  hr{border:0;border-top:1px solid var(--hairline);margin:16px 0}
</style>
</head>
<body>
<div class="app locked" id="app">
  <header class="appbar">
    <div class="brand"><img src="img/tca-logo-horizontal-white.png" alt="TCA Tours"></div>
    <button class="iconbtn sos" onclick="openSOS()" aria-label="Emergency — get help now"><i class="ti ti-urgent"></i></button>
    <button class="iconbtn bell" onclick="openAlerts()" aria-label="Alerts"><i class="ti ti-bell"></i><span class="dot" id="bellDot"></span></button>
  </header>
  <div class="offline" id="offline">Offline — showing the last saved copy</div>

  <main class="screens" id="screens">
    <section class="screen active" id="s-signin"></section>
    <section class="screen" id="s-today"></section>
    <section class="screen" id="s-trip"></section>
    <section class="screen" id="s-around"></section>
    <section class="screen" id="s-more"></section>
    <section class="screen" id="s-page"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="today" onclick="go('today')"><i class="ti ti-calendar-event"></i>Today</button>
    <button class="tab" data-tab="trip" onclick="go('trip')"><i class="ti ti-list-details"></i>Itinerary</button>
    <button class="tab" data-tab="around" onclick="go('around')"><i class="ti ti-train"></i>Getting around</button>
    <button class="tab" data-tab="more" onclick="go('more')"><i class="ti ti-layout-grid"></i>More</button>
  </nav>

  <div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="modalBody"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script src="js/tour-default.js"></script>
<script>
'use strict';
var BUILD = 'v1 · 11 Oct 2026';
var API = '/.netlify/functions/tour';
var NY = 'America/New_York', UK = 'Europe/London';
var LS = { role:'hny_role', key:'hny_staffkey', tour:'hny_tour_v1', priv:'hny_priv_v1', seen:'hny_seen_alerts', reg:'hny_reg_last' };

var T = window.TOUR_DEFAULT || {tour:{},days:[],events:[],flights:[],more:[],links:[],staff:[]};
var P = null;            // staff-only data (only after staff sign-in)
var LIVE = {roomnums:{}, register:{}};
var ALERTS = [];
var role = lsGet(LS.role);
var curTab = 'today', pageStack = [];

/* ================= helpers ================= */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function $(id){ return document.getElementById(id); }
function tel(p){ return 'tel:'+String(p||'').replace(/[^\d+]/g,''); }
function isPhone(p){ return /\d{3}/.test(String(p||'')) && !/@/.test(p); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('on');},2600); }
function paras(text){
  /* text -> <p>…</p>, lines starting with "• " become a list */
  var out='', list=[];
  String(text||'').split(/\n+/).forEach(function(line){
    line=line.trim(); if(!line)return;
    if(/^[•\-]\s*/.test(line)){ list.push(line.replace(/^[•\-]\s*/,'')); return; }
    if(list.length){ out+='<ul>'+list.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'; list=[]; }
    out+='<p>'+esc(line)+'</p>';
  });
  if(list.length) out+='<ul>'+list.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  return out;
}
function isStaff(){ return role==='staff' && !!lsGet(LS.key); }

/* ---------- time zones: wall-clock time in NY/UK -> epoch ms ---------- */
function tzOffset(ts, tz){
  var f=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var p={}; f.formatToParts(new Date(ts)).forEach(function(x){p[x.type]=x.value;});
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-ts;
}
function zoned(dateStr,timeStr,tz){
  if(!dateStr)return NaN; var d=dateStr.split('-'), t=(timeStr||'00:00').split(':');
  var guess=Date.UTC(+d[0],+d[1]-1,+d[2],+t[0],+t[1]);
  var ts=guess-tzOffset(guess,tz); return guess-tzOffset(ts,tz);
}
function fmtClock(ts,tz){ return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ts)); }
function fmtDay(dateStr,opts){ if(!dateStr)return ''; var d=dateStr.split('-'); return new Intl.DateTimeFormat('en-GB',Object.assign({timeZone:'UTC',weekday:'short',day:'numeric',month:'short'},opts||{})).format(new Date(Date.UTC(+d[0],+d[1]-1,+d[2]))); }
function todayIn(tz){ var f=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}); return f.format(new Date()); }
function humanGap(ms){
  var m=Math.round(ms/60000); if(m<1)return {n:'Now',l:''};
  if(m<60)return {n:m,l:m===1?'minute':'minutes'};
  var h=Math.floor(m/60), mm=m%60;
  if(h<24)return {n:h+'h '+(mm<10?'0':'')+mm+'m',l:'to go'};
  var d=Math.floor(h/24); return {n:d,l:d===1?'day to go':'days to go'};
}

/* ---------- events: work out start/end epochs; untimed events follow the one before ---------- */
var ICON={travel:'ti-plane-departure',activity:'ti-map-pin',food:'ti-tools-kitchen-2',event:'ti-ticket','free time':'ti-shopping-bag',info:'ti-info-circle'};
function evIcon(e){ var t=String(e.type||'').toLowerCase();
  if(t==='travel'){ if(/fly|flight|ba\d/i.test(e.title))return 'ti-plane'; if(/coach|transfer|pick-up/i.test(e.title))return 'ti-bus'; if(/subway|train/i.test(e.title))return 'ti-train'; }
  return ICON[t]||'ti-point'; }
function allEvents(){
  var evs=(T.events||[]).slice(); if(P&&P.events) evs=evs.concat(P.events.map(function(e){return Object.assign({staffOnly:true},e);}));
  var byDay={}; evs.forEach(function(e,i){ e._i=i; (byDay[e.day]=byDay[e.day]||[]).push(e); });
  var out=[];
  Object.keys(byDay).map(Number).sort(function(a,b){return a-b;}).forEach(function(d){
    var list=byDay[d].sort(function(a,b){return a._i-b._i;}), last=null;
    list.forEach(function(e){
      var tz=e.clock==='UK'?UK:NY;
      if(e.time){ e.start=zoned(e.date,e.time,tz); e.endTs=e.end?zoned(e.date,e.end,tz):NaN; last=e.start; e.untimed=false; }
      else { e.start=last!=null?last+1:zoned(e.date,'06:00',tz); e.endTs=NaN; e.untimed=true; e.afterTimed=last!=null; }
      out.push(e);
    });
  });
  return out;
}
function evTimeLabel(e){
  if(e.untimed) return e.afterTimed?'Then':(/breakfast/i.test(e.title)?'AM':'—');
  var d=(T.days||[]).filter(function(x){return x.n===e.day;})[0];
  var nextDay=d&&d.date&&e.date&&e.date!==d.date;
  return esc(e.time)+(e.end?'<small>to '+esc(e.end)+'</small>':'')+(e.clock==='UK'?'<small>UK time</small>':'')+(nextDay?'<small>'+esc(fmtDay(e.date,{month:undefined}))+'</small>':'');
}
function endOf(e,evs){
  if(!isNaN(e.endTs))return e.endTs;
  var nx=evs.filter(function(x){return x.start>e.start && !x.untimed;})[0];
  return Math.min(nx?nx.start:e.start+3600e3, e.start+3*3600e3);
}

function go(tab){
  curTab=tab; pageStack=[];
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab);});
  show('s-'+tab);
  ({today:renderToday,trip:renderTrip,around:renderAround,more:renderMore})[tab]();

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('active',s.id===id);});

}
function openPage(html,fn){
  pageStack.push(fn||null);

  show('s-page');
}

/* ================= TODAY ================= */
function renderToday(){
  var evs=allEvents(), now=Date.now(), t=T.tour||{};
  var timed=evs.filter(function(e){return !e.untimed;});
  var first=timed[0], last=timed[timed.length-1];
  var html='';
  html+='<button class="wx" onclick="openWeather()"><i class="ti ti-cloud wi" id="wxIcon"></i><div><div class="wt" id="wxTemp">—</div><div class="wl" id="wxLabel">'+esc(t['Weather Town']||'New York')+'</div></div><div class="wr"><div id="wxRange">Loading…</div><div style="font-weight:600;color:var(--charcoal);margin-top:2px">7-day <i class="ti ti-chevron-right"></i></div></div></button>';
  html+='<div class="clocks"><div>New York<b id="clkNY">'+fmtClock(now,NY)+'</b></div><div>UK<b id="clkUK">'+fmtClock(now,UK)+'</b></div></div>';

  if(first && now<first.start){
    var g=humanGap(first.start-now);
    html+='<div class="next" onclick="openEvent(\''+first.id+'\')"><div class="eyb">We fly in</div><h2>'+esc(g.n)+' '+esc(g.l.replace(' to go',''))+'</h2>'+
      '<div class="meta"><i class="ti ti-plane"></i> '+esc(first.title)+' · '+esc(fmtDay(first.date))+' '+esc(first.time)+(first.clock==='UK'?' (UK)':'')+'</div></div>';
    html+='<p class="label">Day 1 · '+esc(fmtDay(first.date,{weekday:'long'}))+'</p>'+dayRows(evs.filter(function(e){return e.day===first.day;}),evs);
    html+='<button class="btn line" style="margin-top:14px" onclick="go(\'trip\')">See the full itinerary</button>';
  } else if(last && now>endOf(last,evs)+2*3600e3){
    html+='<div class="next"><div class="eyb">Trip complete</div><h2>Welcome <em>home</em></h2><div class="meta">Thanks for travelling with TCA Tours.</div></div>';
  } else {
    var cur=evs.filter(function(e){return !e.untimed && e.start<=now && now<endOf(e,evs);}).pop();
    var nxt=timed.filter(function(e){return e.start>now;})[0];
    if(cur) html+=nextCard(cur,'Happening now',null);
    if(nxt) html+=nextCard(nxt,'Up next',nxt.start-now);
    var d=(cur||nxt||last).day, dd=(T.days||[]).filter(function(x){return x.n===d;})[0];
    html+='<p class="label">Day '+d+' · '+esc(fmtDay(dd?dd.date:'',{weekday:'long'}))+'</p>'+dayRows(evs.filter(function(e){return e.day===d;}),evs);
    var tomorrow=evs.filter(function(e){return e.day===d+1;});
    if(tomorrow.length) html+='<p class="label">Tomorrow</p>'+dayRows(tomorrow.slice(0,4),evs)+'<button class="btn line" style="margin-top:12px" onclick="go(\'trip\')">Full itinerary</button>';
  }
  if(t['Time Note']) html+='<div class="card rule"><h3 style="font-size:19px">Time difference</h3><p class="small muted" style="margin-top:4px">'+esc(t['Time Note'])+'</p></div>';
  $('s-today').innerHTML=html;
  loadWeather();
}
function nextCard(e,eyb,gap){
  var g=gap!=null?humanGap(gap):null;
  return '<div class="next" onclick="openEvent(\''+e.id+'\')"><div class="eyb">'+esc(eyb)+'</div><h2>'+esc(e.title)+'</h2>'+
    (e.where?'<div class="meta"><i class="ti ti-map-pin"></i> '+esc(e.where)+'</div>':'')+
    (g?'<div class="cd"><span class="n">'+esc(g.n)+'</span><span class="l">'+esc(g.l)+' · starts '+esc(e.time)+(e.clock==='UK'?' UK time':'')+'</span></div>':'')+'</div>';
}
function dayRows(list,evs){
  var now=Date.now();
  return '<div class="daybody">'+list.map(function(e){
    var past=!e.untimed && endOf(e,evs)<now, isNow=!e.untimed && e.start<=now && now<endOf(e,evs);
    return '<button class="row'+(past?' past':'')+(isNow?' now':'')+'" onclick="openEvent(\''+e.id+'\')">'+
      '<span class="t">'+evTimeLabel(e)+'</span><span class="ic"><i class="ti '+evIcon(e)+'"></i></span>'+
      '<span class="bd"><span class="tt">'+esc(e.title)+'</span>'+(e.where?'<div class="wh">'+esc(e.where)+'</div>':'')+
      (e.staffOnly?'<span class="tag">Staff only</span>':'')+'</span><i class="ti ti-chevron-right chev"></i></button>';
  }).join('')+'</div>';
}

var WX=null, WMO={0:['Clear','ti-sun'],1:['Mainly clear','ti-sun'],2:['Partly cloudy','ti-cloud'],3:['Cloudy','ti-cloud'],45:['Fog','ti-mist'],48:['Fog','ti-mist'],51:['Drizzle','ti-cloud-rain'],53:['Drizzle','ti-cloud-rain'],55:['Drizzle','ti-cloud-rain'],61:['Light rain','ti-cloud-rain'],63:['Rain','ti-cloud-rain'],65:['Heavy rain','ti-cloud-storm'],71:['Snow','ti-snowflake'],73:['Snow','ti-snowflake'],75:['Snow','ti-snowflake'],80:['Showers','ti-cloud-rain'],81:['Showers','ti-cloud-rain'],82:['Heavy showers','ti-cloud-storm'],95:['Thunderstorm','ti-cloud-storm'],96:['Thunderstorm','ti-cloud-storm'],99:['Thunderstorm','ti-cloud-storm']};

function loadWeather(){
  if(WX){ paintWeather(); return; }
  var t=T.tour||{}, lat=t['Weather Latitude']||40.7979, lon=t['Weather Longitude']||-73.9667;
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FNew_York&forecast_days=7')
    .then(function(r){return r.json();}).then(function(j){ WX=j; paintWeather(); }).catch(function(){ if($('wxRange')) $('wxRange').textContent='Weather unavailable'; });
}
function paintWeather(){
  if(!WX||!WX.current||!$('wxTemp'))return;
  var w=wmo(WX.current.weather_code);
  $('wxTemp').textContent=Math.round(WX.current.temperature_2m)+'°C';

  $('wxIcon').className='ti '+w[1]+' wi';
  if(WX.daily) $('wxRange').textContent=Math.round(WX.daily.temperature_2m_min[0])+'° – '+Math.round(WX.daily.temperature_2m_max[0])+'° · rain '+(WX.daily.precipitation_probability_max[0]||0)+'%';
}
function openWeather(){
  var t=T.tour||{}, html='<p class="label">'+esc(t['Weather Town']||'New York')+'</p><h2>7-day <em>forecast</em></h2>';
  if(WX&&WX.daily){ html+='<div class="list">'+WX.daily.time.map(function(d,i){ var w=wmo(WX.daily.weather_code[i]);
    return '<div class="li"><i class="ti '+w[1]+'" style="font-size:24px"></i><div class="bd"><b>'+esc(fmtDay(d))+'</b><div class="sub">'+esc(w[0])+' · rain '+(WX.daily.precipitation_probability_max[i]||0)+'%</div></div><span class="num" style="font-size:20px">'+Math.round(WX.daily.temperature_2m_min[i])+'° / '+Math.round(WX.daily.temperature_2m_max[i])+'°</span></div>'; }).join('')+'</div>';
  } else html+='<div class="card"><p class="small">Forecast unavailable right now.</p></div>';
  if(t['Weather Note']) html+='<div class="card rule"><h3 style="font-size:19px">What to pack</h3><p class="small" style="margin-top:4px">'+esc(t['Weather Note'])+'</p></div>';
  html+='<p class="small muted">Forecast by Open-Meteo.com</p>';
  openPage(html);
}

    }

function ackAlert(id){ var s=seenAlerts(); if(s.indexOf(id)<0)s.push(id); lsSet(LS.seen,JSON.stringify(s.slice(-60))); closeModal(); loadAlerts(); }

function openSendAlert(){
  openPage('<p class="label">Staff</p><h2>Send an <em>alert</em></h2><p class="small muted">Goes to everyone using the app — students, families and staff. It pops up next time their app checks in (about once a minute while open).</p>'+
    '<input class="field" id="alTitle" placeholder="Headline, e.g. Meet at reception 9.15" style="margin-top:12px" maxlength="80">'+
    '<textarea class="field" id="alMsg" rows="5" placeholder="Message" style="margin-top:10px;resize:vertical"></textarea>'+

function sendAlert(){

function deleteAlert(id){ if(!confirm('Delete this alert for everyone?'))return; var next=ALERTS.filter(function(a){return a.id!==id;}); postStaff('alerts',next).then(function(ok){ if(ok){ ALERTS=next; openSendAlert(); pageStack.pop(); } }); }

/* ================= STAFF DATA ================= */
function postStaff(type,body){
  return fetch(API+'?type='+type,{method:'POST',headers:{'content-type':'application/json','x-staff-key':lsGet(LS.key)||''},body:JSON.stringify(body)})
    .then(function(r){ if(r.status===401){ toast('Staff password has changed — sign in again'); return false; } if(!r.ok){ toast('Could not save ('+r.status+')'); return false; } return r.json().then(function(j){ return j.ok?(j.data||true):false; }); })
    .catch(function(){ toast('No signal — not saved. Try again when you have a connection.'); return false; });
}
function loadPrivate(manual){
  if(!isStaff())return Promise.resolve();
  if(!P){ try{ var c=JSON.parse(lsGet(LS.priv)||'null'); if(c){ P=c.data; LIVE.roomnums=c.roomnums||{}; LIVE.register=c.register||{}; } }catch(e){} }
  return fetch(API+'?type=private',{headers:{'x-staff-key':lsGet(LS.key)||''},cache:'no-store'}).then(function(r){
    if(r.status===401){ toast('Staff password has changed — sign in again'); signOut(); return; }
    if(!r.ok){ if(manual)toast('Could not load staff data ('+r.status+')'); return; }
    return r.json().then(function(j){
      if(!j.data){ if(manual)toast('No staff data published yet — use the admin page'); if($('privMsg'))$('privMsg').textContent='Nothing has been published yet. Upload the App Database in admin.html and press Publish.'; return; }
      P=j.data; LIVE.roomnums=j.roomnums||{}; LIVE.register=j.register||{};
      lsSet(LS.priv,JSON.stringify({data:P,roomnums:LIVE.roomnums,register:LIVE.register}));
      if(manual)toast('Staff data up to date');
      if($('s-more').classList.contains('active')) renderMore();
    });
  }).catch(function(){ if(manual)toast('No signal — showing the last saved copy'); });
}
function needP(){ if(P&&P.students)return true; toast('Staff data not loaded yet'); loadPrivate(true); return false; }
function students(){ return (P&&P.students)||[]; }
function groupsList(){ var g=[]; students().forEach(function(s){ if(s.group&&g.indexOf(s.group)<0)g.push(s.group); }); return g.sort(); }
function teacherOf(g){ var s=students().filter(function(x){return x.group===g&&x.teacher;})[0]; return s?s.teacher:''; }
function roomOf(s){ return LIVE.roomnums[s.id]!=null?LIVE.roomnums[s.id]:(s.room||''); }
function byName(a,b){ var sa=a.name.split(' ').pop(), sb=b.name.split(' ').pop(); return sa.localeCompare(sb)||a.name.localeCompare(b.name); }

/* ---------- REGISTER ---------- */
var REG={roll:null, group:'All', poll:null};
function rolls(){
  var r=[]; Object.keys(LIVE.register).forEach(function(k){ if(k.indexOf('roll|')===0){ var v=LIVE.register[k]; if(v&&!v.deleted) r.push(Object.assign({id:k.slice(5)},v)); } });

}
function marked(rollId,sid){ var v=LIVE.register[rollId+'|'+sid]; return !!(v&&v.on); }
function openRegister(){
  if(!needP())return;
  var rs=rolls();
  var html='<p class="label">Staff · head count</p><h2>Register</h2><p class="small muted">Start a roll call whenever the group moves — leaving the hostel, getting off a train, after free time. Everyone with the staff view sees the same ticks live.</p>'+
    '<input class="field" id="rollName" placeholder="Label, e.g. Leaving MSG" style="margin-top:12px" maxlength="60">'+
    '<button class="btn gold" style="margin-top:10px" onclick="newRoll()"><i class="ti ti-plus"></i> Start a new roll call</button>';

      var n=students().filter(function(s){return marked(r.id,s.id);}).length;
      return '<button class="li" style="width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;background:none;cursor:pointer" onclick="openRoll(\''+esc(r.id)+'\')"><div class="bd"><b>'+esc(r.title)+'</b><div class="sub">'+esc(new Date(r.at).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit',timeZone:NY}))+' NY</div></div><span class="count">'+n+'<span class="small muted">/'+students().length+'</span></span></button>'; }).join('')+'</div>';
  }

}
function newRoll(){
  var id='r'+Date.now().toString(36), label=($('rollName').value||'').trim();
  var title=label||('Roll call · '+new Date().toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit',timeZone:NY}));
  var o={}; o['roll|'+id]={title:title,at:Date.now()};
  LIVE.register['roll|'+id]=o['roll|'+id];

  openRoll(id);
}
function openRoll(id){ REG.roll=id; pageStack.push(openRegister); paintRoll(); clearInterval(REG.poll); REG.poll=setInterval(syncRoll,8000); }
function syncRoll(){
  if(!$('regList')){ clearInterval(REG.poll); return; }
  fetch(API+'?type=register',{headers:{'x-staff-key':lsGet(LS.key)||''},cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){ if(j){ LIVE.register=j; if($('regList')) paintRoll(true); } }).catch(function(){});
}
function paintRoll(keepScroll){
  var r=LIVE.register['roll|'+REG.roll]||{title:'Roll call'}, gs=groupsList();
  var list=students().filter(function(s){return REG.group==='All'||s.group===REG.group;}).sort(byName);
  var here=list.filter(function(s){return marked(REG.roll,s.id);}), missing=list.filter(function(s){return !marked(REG.roll,s.id);});
  var html='<p class="label">'+esc(r.title)+'</p>'+
    '<div class="seg">'+['All'].concat(gs).map(function(g){return '<button class="'+(REG.group===g?'on':'')+'" onclick="REG.group=\''+esc(g)+'\';paintRoll()">'+esc(g==='All'?'Everyone':g)+'</button>';}).join('')+'</div>'+
    '<div class="regbar"><span class="big">'+here.length+'</span><span class="of">of '+list.length+' here'+(REG.group!=='All'&&teacherOf(REG.group)?'<br>'+esc(teacherOf(REG.group))+'\'s group':'')+'</span>'+
    (missing.length?'<span class="tag alarm" style="margin:0 0 0 auto">'+missing.length+' missing</span>':'<span class="tag gold" style="margin:0 0 0 auto">All here</span>')+'</div>'+
    (missing.length&&missing.length<=8?'<p class="small" style="margin-bottom:8px"><span class="flag">Missing:</span> '+missing.map(function(s){return esc(s.name);}).join(', ')+'</p>':'')+
    '<div id="regList">'+list.map(function(s){ var on=marked(REG.roll,s.id);
      return '<button class="pupil'+(on?' on':'')+'" onclick="tick(\''+s.id+'\')"><span class="box"><i class="ti ti-check"></i></span><span class="nm">'+esc(s.name)+'</span><span class="gp">'+esc(s.group)+'</span></button>'; }).join('')+'</div>'+
    '<div class="btnrow" style="margin-top:14px"><button class="btn line" onclick="markAll(true)">Tick all shown</button><button class="btn line" onclick="markAll(false)">Clear shown</button></div>';
  if(keepScroll) rerenderPage(html); else { $('s-page').innerHTML='<button class="back" onclick="clearInterval(REG.poll);pageBack()"><i class="ti ti-chevron-left"></i> Back</button>'+html; show('s-page'); }
}
function tick(sid){
  var k=REG.roll+'|'+sid, on=!marked(REG.roll,sid), o={}; o[k]={on:on,at:Date.now()};
  LIVE.register[k]=o[k]; paintRoll(true);
  postStaff('register',o).then(function(d){ if(d&&d!==true){ LIVE.register=d; if($('regList'))paintRoll(true); } });
}
function markAll(on){
  var o={}; students().filter(function(s){return REG.group==='All'||s.group===REG.group;}).forEach(function(s){ var k=REG.roll+'|'+s.id; o[k]={on:on,at:Date.now()}; LIVE.register[k]=o[k]; });
  paintRoll(true); postStaff('register',o);
}

  groupsList().forEach(function(g){
    var list=students().filter(function(s){return s.group===g;}).sort(byName);
    html+='<p class="label">'+esc(g)+' · '+list.length+'</p><p class="small" style="margin:-4px 0 8px">Teacher: <b>'+esc(teacherOf(g)||'—')+'</b> · <button class="linkbtn" onclick="roomForGroup(\''+esc(g)+'\')">Same room for the whole group</button></p><div class="list">'+
      list.map(function(s){ return '<div class="li"><div class="bd"><b>'+esc(s.name)+'</b></div><input class="roominput" inputmode="numeric" aria-label="Room number for '+esc(s.name)+'" placeholder="Room" value="'+esc(roomOf(s))+'" onchange="saveRoom(\''+s.id+'\',this.value)"></div>'; }).join('')+'</div>';
  });
  openPage(html,openRooms);
}
function saveRoom(id,v){ var o={}; o[id]=String(v||'').trim(); LIVE.roomnums[id]=o[id]; postStaff('roomnums',o).then(function(d){ if(d){ if(d!==true)LIVE.roomnums=d; toast('Room saved'); } }); }
function roomForGroup(g){
  var v=prompt('Room number for everyone in '+g+':'); if(v==null)return; v=v.trim();
  var o={}; students().filter(function(s){return s.group===g;}).forEach(function(s){ o[s.id]=v; LIVE.roomnums[s.id]=v; });
  postStaff('roomnums',o).then(function(d){ if(d){ if(d!==true)LIVE.roomnums=d; toast('Rooms saved'); pageStack.pop(); openRooms(); } });
}

/* ---------- MEDICAL / DIETARY / SEND ---------- */
var SERIOUS=/epipen|anaphyla|peanut|nut |allerg|999|blood clot|tegretol|seizure|epilep|asthma|inhaler|diabet|insulin/i;
function personCard(s,fields){
  var body=fields.map(function(f){ return s[f[0]]?'<dt>'+f[1]+'</dt><dd>'+esc(s[f[0]])+'</dd>':''; }).join('');
  var serious=fields.some(function(f){return SERIOUS.test(s[f[0]]||'');});
  return '<div class="card'+(serious?' rule':'')+'"><div class="cardhead"><h3 style="font-size:20px">'+esc(s.name)+'</h3>'+(serious?'<span class="tag alarm">Check</span>':'')+'</div>'+
    '<p class="small muted">'+esc(s.group)+(roomOf(s)?' · Room '+esc(roomOf(s)):'')+(s.dob?' · DOB '+esc(fmtDay(s.dob,{weekday:undefined,year:'numeric'})):'')+'</p><dl class="kv">'+body+'</dl></div>';
}
function listPage(eyb,title,intro,fields,emptyMsg){
  if(!needP())return;
  var list=students().filter(function(s){return fields.some(function(f){return s[f[0]];});}).sort(function(a,b){
    var sa=fields.some(function(f){return SERIOUS.test(a[f[0]]||'');}), sb=fields.some(function(f){return SERIOUS.test(b[f[0]]||'');}); return (sb-sa)||byName(a,b); });
  openPage('<p class="label">'+eyb+'</p><h2>'+title+'</h2><p class="small muted">'+intro+' '+list.length+' of '+students().length+' students have something recorded. Students not listed had nothing to note (blank, N/A, none).</p>'+
    (list.length?list.map(function(s){return personCard(s,fields);}).join(''):'<div class="card"><p class="small">'+emptyMsg+'</p></div>'));
}
function openMedical(){ listPage('Staff · medical','Medical <em>&amp; medication</em>','From the Students tab. Cards marked Check mention an allergy, EpiPen, inhaler, epilepsy medication or similar — read those first.',[['meds','Medication'],['side','Side effects / action'],['diet','Dietary']],'No medical information recorded.'); }
function openDietary(){ listPage('Staff · dietary','Dietary <em>needs</em>','Allergies and food requirements.',[['diet','Dietary']],'No dietary requirements recorded.'); }
function openSEND(){ listPage('Staff · SEND','SEND <em>information</em>','Special educational needs and disabilities.',[['send','SEND'],['notes','Notes']],'No SEND information has been added yet. Add it in the SEND column of the Students tab, then publish again.'); }

/* ---------- MEAL ORDERS ---------- */
function openMeals(i){
  if(!needP())return;
  var meals=P.meals||[]; i=i||0; var m=meals[i];
  if(!m){ openPage('<h2>Meal orders</h2><div class="card"><p class="small">No meal orders in the App Database.</p></div>'); return; }
  var dishes={}; m.orders.forEach(function(o){ dishes[o.order]=(dishes[o.order]||0)+1; });
  var diet={}; students().forEach(function(s){ if(s.diet) diet[s.name.toLowerCase()]=s.diet; });
  var html='<p class="label">Staff · pre-orders</p><h2>'+esc(m.venue)+'</h2><p class="small muted">'+esc(fmtDay(m.date,{weekday:'long'}))+' · '+m.orders.length+' meals</p>'+
    (meals.length>1?'<div class="seg">'+meals.map(function(x,j){return '<button class="'+(j===i?'on':'')+'" onclick="pageStack.pop();openMeals('+j+')">'+esc(x.venue)+'</button>';}).join('')+'</div>':'')+
    '<p class="label">Totals</p><div class="list">'+Object.keys(dishes).sort(function(a,b){return dishes[b]-dishes[a];}).map(function(d){return '<div class="li"><div class="bd">'+esc(d)+'</div><span class="count">'+dishes[d]+'</span></div>';}).join('')+
    '<div class="li" style="background:var(--stone)"><div class="bd"><b>Total</b><div class="sub">counted from '+m.orders.length+' rows in Meal Orders</div></div><span class="count">'+m.orders.length+'</span></div></div>'+
    '<p class="label">By person</p><div class="list">'+m.orders.slice().sort(byName).map(function(o){ var d=diet[o.name.toLowerCase()];
      return '<div class="li"><div class="bd"><b>'+esc(o.name)+'</b><div class="sub">'+esc(o.order)+(o.note?' · <span class="flag">'+esc(o.note)+'</span>':'')+(d?'<br>Dietary: <span class="'+(SERIOUS.test(d)?'flag':'')+'">'+esc(d)+'</span>':'')+'</div></div></div>'; }).join('')+'</div>';
  openPage(html);
}

/* ---------- TRANSFERS / CONTACTS ---------- */
function openTransfers(){
  if(!needP())return;
  openPage('<p class="label">Staff · coaches</p><h2>Transfers</h2>'+(P.transfers||[]).map(function(x){
    var phones=String(x.phones||'').split('·').map(function(p){return p.trim();}).filter(Boolean);
    return '<div class="card rule"><div class="cardhead"><h3 style="font-size:21px">'+esc(x.type||'Transfer')+'</h3><span class="small muted">'+esc(fmtDay(x.date))+'</span></div>'+
      '<dl class="kv"><dt>Pick-up</dt><dd><b>'+esc(x.pickup)+'</b></dd><dt>From</dt><dd>'+esc(x.from)+'</dd><dt>To</dt><dd>'+esc(x.to)+'</dd>'+(x.pax?'<dt>People</dt><dd>'+esc(x.pax)+(x.bags?' · '+esc(x.bags)+' bags':'')+'</dd>':'')+
      '<dt>Ref</dt><dd><span class="num" style="font-size:22px">'+esc(x.ref)+'</span></dd></dl>'+(x.notes?'<div class="prose small" style="margin-top:8px">'+paras(x.notes)+'</div>':'')+
      (phones.length?'<div style="margin-top:10px">'+phones.map(function(p){ var num=p.replace(/\(.*\)/,'').trim(); return '<a class="btn line" href="'+tel(num)+'"><i class="ti ti-phone"></i> '+esc(p)+'</a>'; }).join('')+'</div>':'')+'</div>';
  }).join(''));
}
function openContacts(){ openSOS(); }

/* ================= ADD TO HOME SCREEN ================= */
function openA2HS(){
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  openModal('<p class="label">Add to your phone</p><h2 style="font-size:28px">One tap to <em>open</em></h2><p class="small muted" style="margin:6px 0 12px">No app store needed. It opens full-screen and keeps the last itinerary it loaded, so you can check it on the subway without signal.</p>'+
    '<div class="prose small">'+(ios?'<ul><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button <i class="ti ti-share-2"></i>.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li></ul>':'<ul><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu, top right.</li><li>Tap <b>Add to Home screen</b> (or <b>Install app</b>).</li></ul>')+'</div>'+
    '<button class="btn gold" style="margin-top:14px" onclick="closeModal()">Done</button>');
}

/* ================= DATA LOADING ================= */
function loadTour(){
  try{ var c=JSON.parse(lsGet(LS.tour)||'null'); if(c&&c.events&&c.events.length) T=c; }catch(e){}
  return fetch(API,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    $('offline').classList.remove('on');
    if(j&&Array.isArray(j.events)&&j.events.length){ T=j; lsSet(LS.tour,JSON.stringify(j)); }
  }).catch(function(){ $('offline').classList.add('on'); });
}
function refresh(){
  if(!role)return;
  var top=$('screens').scrollTop;
  if($('s-today').classList.contains('active')) renderToday();
  else if($('s-more').classList.contains('active')) renderMore();
  $('screens').scrollTop=top;
}

(function init(){
  if(role==='staff'&&!lsGet(LS.key)) role=null;
  if(role){ enter(); } else { renderSignin(); }
  loadTour().then(function(){ if(role) refresh(); else renderSignin(); });
  if(role==='staff') loadPrivate();
  loadAlerts();
  setInterval(loadAlerts,60000);
  setInterval(function(){ if($('clkNY')){ $('clkNY').textContent=fmtClock(Date.now(),NY); $('clkUK').textContent=fmtClock(Date.now(),UK); } },15000);
  setInterval(function(){ if(role&&$('s-today').classList.contains('active')) refresh(); },60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ loadTour().then(refresh); loadAlerts(); if(isStaff())loadPrivate(); } });
  window.addEventListener('online',function(){ $('offline').classList.remove('on'); });
  window.addEventListener('offline',function(){ $('offline').classList.add('on'); });
})();
</script>
